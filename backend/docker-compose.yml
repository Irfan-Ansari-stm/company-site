version: '3.9'

services:
  # ── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: enterprise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-enterprise_db}
      POSTGRES_USER:     ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount SQL init files to auto-create schema on first run
      - ./sql/part1.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/part2.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app_user} -d ${DB_NAME:-enterprise_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_net

  # ── Redis (optional — for job queues / caching) ──────────
  redis:
    image: redis:7-alpine
    container_name: enterprise_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - enterprise_net

  # ── Backend API ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enterprise_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:   ${NODE_ENV:-production}
      PORT:       5000
      DB_HOST:    postgres
      DB_PORT:    5432
      REDIS_URL:  redis://:${REDIS_PASSWORD:-changeme}@redis:6379
    volumes:
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - enterprise_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/v1/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend website and dashboard
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - enterprise_net

  # ── Nginx reverse proxy (optional) ────────────────────────
  nginx:
    image: nginx:alpine
    container_name: enterprise_nginx
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    networks:
      - enterprise_net
    profiles:
      - production  # Only starts with: docker compose --profile production up

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  enterprise_net:
    driver: bridge
